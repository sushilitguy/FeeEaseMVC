<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section Management - FeeEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex-grow: 1;
      display: flex;
      overflow: hidden;
    }
    .menu-section {
      background-color: #f8f9fa;
      width: 250px;
      padding: 20px;
      border-right: 1px solid #e9ecef;
      overflow-y: auto;
    }
    .menu-section a {
      color: #068388;
      font-weight: 500;
      display: block;
      padding: 10px;
      text-decoration: none;
      border-radius: 5px;
    }
    .menu-section a.active {
      color: #fff;
      background-color: #068388;
    }
    .menu-section a:hover {
      background-color: rgba(6, 131, 136, 0.1);
    }
    .content-section {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .custom-tab {
        color: #068388 !important;
    }
    .custom-tab:hover {
        color: #fff !important;
        background-color: #056a6e !important;
        border-color: #056a6e !important;
    }
    .btn-custom {
      background-color: #068388;
      color: white;
    }
    .btn-custom:hover {
      background-color: #056a6e;
    }
  </style>
</head>
<body>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Content -->
<div class="main-content">
  <!-- Sidebar (Menu Section) -->
  <div th:replace="~{fragments/sidebar :: sidebar('school', 'section')}"></div>

  <!-- Content Section -->
  <div class="content-section">
    <div class="container-fluid">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Sections</a>
        </li>
      </ul>
      <!-- Add/Edit Standard Form -->
      <form id="sectionForm" th:if="${Role == 'Admin'}" method="post" class="row g-3" style="margin-top:10px;" action="/fee_ease/school/sections/add">
        <div class="col-auto">
          <input type="hidden" name="sectionId" id="sectionId">
          <label for="sectionName" class="visually-hidden">Section</label>
          <input type="text" class="form-control" id="sectionName" name="sectionName" placeholder="Section">
        </div>
        <div class="col-auto">
          <button id="submitBtn" type="submit" class="btn btn-custom mb-3">Add Section</button>
        </div>
      </form>

      <div class="alert alert-danger text-center" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">
        No Section Data is present, please add Section Data.
      </div>

      <table class="table table-striped" style="margin-top: 5px;" th:if="${not #lists.isEmpty(sections)}">
        <thead>
        <tr>
          <th>S. No.</th>
          <th>Section</th>
          <th th:if="${Role == 'Admin'}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sectionData, iterStat : ${sections}">
          <td th:text="${iterStat.index + 1}"></td>
          <td th:text="${sectionData.sectionName}"></td>

          <td th:if="${Role == 'Admin'}">
            <button type="button" class="btn btn-secondary" th:data-id="${sectionData.id}"
                    th:data-name="${sectionData.sectionName}"
                    onclick="populateForm(this)">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"></path>
                <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"></path>
              </svg>
              <i class="bi bi-pencil-square"></i>
              Edit
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
  function populateForm(button) {
    const sectionId = button.getAttribute("data-id");
    const sectionName = button.getAttribute("data-name");

    document.getElementById("sectionId").value = sectionId;
    document.getElementById("sectionName").value = sectionName;

    // Update the form action dynamically
    document.getElementById("sectionForm").setAttribute("action", "/fee_ease/school/sections/update");

    // Change button text
    document.getElementById("submitBtn").textContent = "Update Section";
  }
</script>
</body>
</html>
