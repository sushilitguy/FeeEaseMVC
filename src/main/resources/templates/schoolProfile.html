<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Management - FeeEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        body {
          height: 100vh;
          display: flex;
          flex-direction: column;
        }
        .main-content {
          flex-grow: 1;
          display: flex;
          overflow: hidden;
        }
        .menu-section {
          background-color: #f8f9fa;
          width: 250px;
          padding: 20px;
          border-right: 1px solid #e9ecef;
          overflow-y: auto;
        }
        .menu-section a {
          color: #068388;
          font-weight: 500;
          display: block;
          padding: 10px;
          text-decoration: none;
          border-radius: 5px;
        }
        .menu-section a.active {
          color: #fff;
          background-color: #068388;
        }
        .menu-section a:hover {
          background-color: rgba(6, 131, 136, 0.1);
        }
        .content-section {
          flex-grow: 1;
          padding: 20px;
          overflow-y: auto;
        }
        .custom-tab {
            color: #068388 !important;
        }
        .custom-tab:hover {
            color: #fff !important;
            background-color: #056a6e !important;
            border-color: #056a6e !important;
        }
    </style>
</head>
<body>
<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Content -->
<div class="main-content">
    <!-- Sidebar (Menu Section) -->
    <div th:replace="~{fragments/sidebar :: sidebar('school', 'schoolProfile')}"></div>

    <!-- Content Section -->
    <div class="content-section">
        <div class="container-fluid">
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">School Profile</a>
                </li>
            </ul>
            <!-- School Profile Section -->
            <div class="row gx-5" style="margin-top:20px">
                <!-- School Logo and Upload -->
                <div class="col-2" style="padding:10px">
<!--                        <img id="school-logo" src="default-logo.png" alt="School Logo" class="w-32 h-32 object-cover rounded-full border border-gray-300 mb-2">-->
                    <img th:src="${SchoolLogo}" class="img-thumbnail rounded float-start" style="object-fit: cover;" width="200" height="200" alt="schoolLogo" />
                    <form th:if="${Role == 'Admin'}" id="logo-upload-form" enctype="multipart/form-data" action="/fee_ease/school/upload" method="post">
                        <div class="mb-3">
                            <label for="schoolLogo" class="form-label" style="color:blue; cursor: pointer; margin-top:20px;">Change School Logo</label>
                            <input class="form-control" type="file" name="logoFile" accept="image/*" id="schoolLogo" style="display:none" onchange="submit()">
                        </div>
                    </form>
                </div>

                <!-- School Info -->
                <div class="col-10">
                    <h2 class="text-2xl font-semibold text-gray-800" th:text="${SchoolName}">Sunrise Public School</h2>
                    <p class="text-gray-600 mt-1"><b>Address : </b><span th:text="${school.address}">123 Education Lane, Knowledge City, State 456789</span></p>
                    <p class="text-gray-600 mt-1"><b>Contact No : </b><span th:text="${school.contactNo}">123456789</span></p>
                    <p class="text-gray-600 mt-1"><b>Email : </b><span th:text="${school.email}">contact@sunriseschool.edu</span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script

</script>
</body>
</html>
